[project]
name = "eurovalidate-mcp"
version = "0.1.1"
description = "MCP server for EuroValidate — validate EU VAT numbers (VIES), IBANs, EORI customs numbers and look up company data from LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "EuroValidate", email = "support@eurovalidate.com" }]
keywords = [
    "mcp", "model-context-protocol", "vat", "vies", "iban", "eori",
    "vat-validation", "eu-vat", "kyb", "compliance", "llm", "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://eurovalidate.com"
Documentation = "https://api.eurovalidate.com/docs"
Repository = "https://github.com/Nitrych/eurovalidate-mcp"

[project.scripts]
eurovalidate-mcp = "eurovalidate_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eurovalidate_mcp"]
